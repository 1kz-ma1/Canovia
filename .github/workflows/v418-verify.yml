name: V41.8 Native AI Practice verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'resources/views/study_practice/**'
      - 'routes/**'
      - 'tests/**'
      - 'docs/**'
      - '.env.example'
      - '.github/workflows/v418-verify.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: php -l app/Http/Controllers/StudyPracticeController.php
      - run: php -l app/Services/NativeAiGateway.php
      - run: php -l app/Services/NativeAiStudyPracticeQuestionProvider.php
      - run: php -l app/Services/NativeAiStudyPracticeAssessmentProvider.php
      - run: php -l app/Services/StudyPracticeOrchestrator.php
      - run: php -l app/Services/StudyPracticeProviderRouter.php
      - run: php artisan view:cache
      - name: Focused regression
        run: >
          php artisan test
          tests/Feature/NativeAiPracticeV418Test.php
          tests/Feature/FeatureAccessV406Test.php
          tests/Feature/EconomyFoundationV415Test.php
          tests/Feature/AdminPremiumExperienceV417Test.php
          tests/Feature/StudyPracticeOrchestrationV401Test.php
          tests/Feature/StudyPracticeCalibrationV414Test.php

  full-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Full suite on V41.8 branch
        continue-on-error: true
        run: php artisan test

  full-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Full suite on main baseline
        continue-on-error: true
        run: php artisan test

name: V41.12 Verify

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Syntax and Blade cache
        run: |
          php -l app/Models/StudyRecallSource.php
          php -l app/Models/StudyRecallCandidate.php
          php -l app/Services/NativeAiGateway.php
          php -l app/Services/StudyRecallCandidateExtractionService.php
          php -l app/Http/Controllers/StudyRecallCandidateController.php
          php -l app/Http/Controllers/StudyRecallController.php
          php -l tests/Feature/StudyRecallCandidateV4112Test.php
          php artisan view:cache
      - name: Focused regression tests
        run: |
          php artisan test \
            tests/Feature/StudyRecallCandidateV4112Test.php \
            tests/Feature/StudyRecallV4111Test.php \
            tests/Feature/StudyActivityPolicyV4110Test.php \
            tests/Feature/NativeAiPracticeV418Test.php \
            tests/Feature/StudyTaskProgressionV4110Test.php

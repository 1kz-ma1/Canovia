name: V41.10B Verify

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Syntax and Blade cache
        run: |
          php -l app/Services/StudyActivityPolicyService.php
          php -l app/Services/StudyPracticeReliabilityService.php
          php -l app/Http/Controllers/StudyActivityController.php
          php -l app/Services/PlanToolService.php
          php -l app/Http/Controllers/StudyPracticeController.php
          php -l app/Http/Controllers/PlanController.php
          php -l tests/Feature/StudyActivityPolicyV4110Test.php
          php artisan view:cache
      - name: Focused regression tests
        run: |
          php artisan test \
            tests/Feature/StudyActivityPolicyV4110Test.php \
            tests/Feature/StudyTaskProgressionV4110Test.php \
            tests/Feature/StudyPracticeGuidedFlowV4074Test.php \
            tests/Feature/StudyPracticeLearningLoopV393Test.php \
            tests/Feature/StudyPracticeCalibrationV414Test.php \
            tests/Feature/NativeAiPracticeV418Test.php \
            tests/Feature/HybridQuestionAssemblyV4182Test.php \
            tests/Feature/ActionFirstV416Test.php

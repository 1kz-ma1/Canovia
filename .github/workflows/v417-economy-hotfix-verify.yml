name: V41.7 Economy hotfix verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/views/admin/economy/index.blade.php'
      - 'tests/Feature/EconomyFoundationV415Test.php'
      - '.github/workflows/v417-economy-hotfix-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: php artisan view:cache
      - run: php artisan test tests/Feature/EconomyFoundationV415Test.php

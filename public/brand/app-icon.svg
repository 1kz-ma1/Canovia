    <circle cx="251" cy="526" r="18" fill="#DDEBFF" filter="url(#softGlow)"/>
    <circle cx="646" cy="367" r="15" fill="#FFC978" filter="url(#softGlow)"/>

    <path d="M393 140c17 92 48 123 140 140-92 17-123 48-140 140-17-92-48-123-140-140 92-17 123-48 140-140Z" fill="url(#star)" filter="url(#glow)"/>

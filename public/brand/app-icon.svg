    <circle cx="122" cy="158" r="3" fill="#EAF8FF"/><circle cx="192" cy="104" r="6" fill="#7FDBFF" opacity=".72"/><circle cx="798" cy="126" r="4" fill="#FFD79C"/><circle cx="860" cy="296" r="3" fill="#D7CFFF"/><circle cx="168" cy="420" r="4" fill="#FFF0C4"/><circle cx="885" cy="618" r="5" fill="#7FDBFF" opacity=".7"/><circle cx="708" cy="512" r="2.5" fill="#fff" opacity=".85"/>
    <path d="M112 312h42M133 291v42" stroke="#FFD48B" stroke-width="5" stroke-linecap="round" opacity=".8" filter="url(#softGlow)"/>
    <path d="M820 208h32M836 192v32" stroke="#D9F5FF" stroke-width="4" stroke-linecap="round" opacity=".75" filter="url(#softGlow)"/>


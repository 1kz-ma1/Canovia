<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">PaceKeeper app icon</title>
  <defs>
    <radialGradient id="bg" cx="28%" cy="15%" r="105%">
      <stop offset="0" stop-color="#111B3F"/>
      <stop offset=".48" stop-color="#071027"/>
      <stop offset="1" stop-color="#020615"/>
    </radialGradient>
    <linearGradient id="orbit" x1="150" y1="700" x2="805" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70DBFF"/>
      <stop offset=".5" stop-color="#7184FF"/>
      <stop offset="1" stop-color="#B88CFF"/>
    </linearGradient>
    <linearGradient id="planet" x1="260" y1="746" x2="770" y2="1010" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173E8C"/>

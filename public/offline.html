<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>PaceKeeper - 前回の状態</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020617;color:#e2e8f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(14,165,233,.16),transparent 32rem),#020617}.wrap{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:-.03em}.brand img{width:28px;height:28px;filter:drop-shadow(0 0 8px rgba(167,139,250,.25))}.brand span{background:linear-gradient(90deg,#f8fafc,#c7d2fe,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}.state{display:flex;align-items:center;gap:7px;font-size:12px;color:#94a3b8}.dot{width:8px;height:8px;border-radius:99px;background:#f59e0b}.dot.ok{background:#10b981}.card{margin-top:18px;border:1px solid rgba(148,163,184,.18);border-radius:24px;background:rgba(15,23,42,.78);padding:20px;backdrop-filter:blur(18px)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#7dd3fc}.title{font-size:25px;line-height:1.2;margin:8px 0 0}.muted{color:#94a3b8;font-size:14px;line-height:1.65}.now{margin-top:16px;border:1px solid rgba(56,189,248,.3);background:rgba(14,165,233,.1);border-radius:20px;padding:16px}.now h2{font-size:19px;margin:6px 0}.note{margin-top:12px;background:rgba(2,6,23,.55);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btn{appearance:none;border:0;border-radius:14px;min-height:46px;padding:0 16px;font-weight:800;font-size:14px;color:#e0f2fe;background:#0369a1}.btn.secondary{background:#1e293b;color:#e2e8f0}.btn:disabled{opacity:.45}.road{margin-top:20px}.node{display:flex;gap:12px;min-height:58px}.rail{width:24px;display:flex;flex-direction:column;align-items:center}.circle{display:grid;place-items:center;width:24px;height:24px;border:1px solid #475569;border-radius:99px;color:#94a3b8;font-size:12px}.line{width:1px;flex:1;background:#334155}.node.current .circle{border-color:#38bdf8;color:#bae6fd;background:rgba(14,165,233,.18)}.node.done .circle{border-color:#10b981;color:#a7f3d0}.node-main{padding:1px 0 18px;min-width:0}.node-title{font-size:14px;font-weight:750;color:#e2e8f0}.node-meta{font-size:11px;color:#64748b;margin-top:4px}.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:900;letter-spacing:-.04em;margin-top:12px}.hidden{display:none}.small{font-size:12px;color:#64748b;margin-top:14px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand"><img src="/brand/logo-mark.svg" alt=""><span>PaceKeeper</span></div><div class="state"><span id="netDot" class="dot"></span><span id="netLabel">前回の状態を表示中</span></div></div>
  <section class="card">
    <div class="eyebrow">Instant Start</div>
    <h1 id="planTitle" class="title">前回のPaceKeeperを読み込んでいます</h1>
    <p class="muted">Renderの起動を待たず、端末に残した現在地を先に表示しています。接続はバックグラウンドで続けます。</p>
    <div id="currentCard" class="now hidden">
      <div class="eyebrow">今ここ</div>
      <h2 id="taskTitle"></h2>
      <div id="taskNote" class="note hidden"></div>
      <div id="timer" class="timer hidden">00:00</div>
      <div class="actions">
        <button id="startBtn" class="btn" type="button">オフラインで開始</button>
        <button id="pauseBtn" class="btn secondary hidden" type="button">一時停止</button>
        <button id="finishBtn" class="btn secondary hidden" type="button">記録して終了</button>
      </div>
      <p id="syncHint" class="small">接続でき次第、通常画面へ自動で戻ります。</p>
    </div>
    <div id="roadmap" class="road"></div>
  </section>
</main>
<script>
const DB='pacekeeper-offline-v1', STORE='state';
let snapshot=null, offlineSession=null, timerId=null, serverReady=false;
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function get(k){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function put(k,v){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function del(k){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function elapsed(s){const now=Date.now();const end=s.ended_at?Date.parse(s.ended_at):now;const start=Date.parse(s.started_at);const pause=s.paused_seconds||0;const livePause=s.paused_at?Math.max(0,(now-Date.parse(s.paused_at))/1000):0;return Math.max(0,Math.floor((end-start)/1000-pause-livePause))}
function fmt(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function renderTimer(){const el=document.getElementById('timer');if(!offlineSession){el.classList.add('hidden');return}el.classList.remove('hidden');el.textContent=fmt(elapsed(offlineSession))}
function controls(){const started=!!offlineSession&&!offlineSession.ended_at;document.getElementById('startBtn').classList.toggle('hidden',started||!!offlineSession?.ended_at);document.getElementById('pauseBtn').classList.toggle('hidden',!started);document.getElementById('finishBtn').classList.toggle('hidden',!started);if(started)document.getElementById('pauseBtn').textContent=offlineSession.paused_at?'再開':'一時停止'}
function render(){if(!snapshot)return;document.getElementById('planTitle').textContent=snapshot.plan?.title||'PaceKeeper';const current=snapshot.current;if(current){document.getElementById('currentCard').classList.remove('hidden');document.getElementById('taskTitle').textContent=current.title||'次のTask';const note=current.next_action_note||snapshot.continuity?.next_action_note;const ne=document.getElementById('taskNote');if(note){ne.textContent='次回ここから：'+note;ne.classList.remove('hidden')}else ne.classList.add('hidden')}const road=document.getElementById('roadmap');road.innerHTML='';(snapshot.roadmap||[]).slice(0,12).forEach((n,i,a)=>{const d=document.createElement('div');d.className='node '+(n.is_current?'current ':'')+(n.status==='done'?'done ':'');d.innerHTML=`<div class="rail"><span class="circle">${n.status==='done'?'✓':n.is_current?'◎':'○'}</span>${i<a.length-1?'<span class="line"></span>':''}</div><div class="node-main"><div class="node-title"></div><div class="node-meta"></div></div>`;d.querySelector('.node-title').textContent=n.title;d.querySelector('.node-meta').textContent=`${n.status_label||n.status||''} · ${n.progress_percent||0}% · 残り${n.remaining_minutes||0}分`;road.appendChild(d)});renderTimer();controls()}
async function start(){if(!snapshot?.current?.task_id)return;offlineSession={client_session_id:uuid(),task_id:snapshot.current.task_id,task_title:snapshot.current.title,started_at:new Date().toISOString(),paused_at:null,paused_seconds:0,ended_at:null};await put('offline_session',offlineSession);render();timerId=setInterval(renderTimer,1000)}
async function pauseResume(){if(!offlineSession||offlineSession.ended_at)return;if(offlineSession.paused_at){offlineSession.paused_seconds+=(Date.now()-Date.parse(offlineSession.paused_at))/1000;offlineSession.paused_at=null}else offlineSession.paused_at=new Date().toISOString();await put('offline_session',offlineSession);controls()}
async function finish(){if(!offlineSession)return;if(offlineSession.paused_at){offlineSession.paused_seconds+=(Date.now()-Date.parse(offlineSession.paused_at))/1000;offlineSession.paused_at=null}offlineSession.ended_at=new Date().toISOString();offlineSession.actual_seconds=elapsed(offlineSession);await put('offline_session',offlineSession);controls();await trySync()}
let handoffInProgress=false,probeTimer=null;
function handoffToNetwork(){
  if(handoffInProgress)return;
  handoffInProgress=true;
  if(probeTimer)clearInterval(probeTimer);
  document.getElementById('netLabel').textContent='最新画面を読み込み中…';
  const target=new URL(window.location.href);
  target.searchParams.set('_pk_network','1');
  setTimeout(()=>window.location.replace(target.href),300);
}
async function trySync(){if(!offlineSession?.ended_at||!snapshot?.csrf_token)return false;try{const r=await fetch('/offline/work-sessions/sync',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json','X-CSRF-TOKEN':snapshot.csrf_token},body:JSON.stringify({client_session_id:offlineSession.client_session_id,task_id:offlineSession.task_id,started_at:offlineSession.started_at,ended_at:offlineSession.ended_at,actual_seconds:offlineSession.actual_seconds,intended_minutes:null})});if(!r.ok)return false;await del('offline_session');offlineSession=null;handoffToNetwork();return true}catch{return false}}
async function probe(){
  if(handoffInProgress)return;
  try{
    const r=await fetch('/health?ts='+Date.now(),{cache:'no-store',credentials:'same-origin'});
    if(!r.ok)throw 0;
    serverReady=true;
    document.getElementById('netDot').classList.add('ok');
    document.getElementById('netLabel').textContent='接続できました';
    if(offlineSession?.ended_at){const synced=await trySync();if(!synced)handoffToNetwork();return}
    if(!offlineSession){
      // Retry exactly once through the SW's network-only path.
      handoffToNetwork();
    }
  }catch{
    serverReady=false;
    document.getElementById('netDot').classList.remove('ok');
    document.getElementById('netLabel').textContent=navigator.onLine?'サーバーを起動中…':'オフライン';
  }
}
document.getElementById('startBtn').addEventListener('click',start);document.getElementById('pauseBtn').addEventListener('click',pauseResume);document.getElementById('finishBtn').addEventListener('click',finish);
(async()=>{snapshot=await get('latest_snapshot');offlineSession=await get('offline_session');render();if(offlineSession&&!offlineSession.ended_at)timerId=setInterval(renderTimer,1000);await probe();if(!handoffInProgress)probeTimer=setInterval(probe,2500)})().catch(()=>{if(!handoffInProgress)probeTimer=setInterval(probe,2500);probe()});
</script>
</body>
</html>
